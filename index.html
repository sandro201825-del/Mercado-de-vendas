<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ferramenta de Vendas V1.5</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f6f8;color:#17202a}header{background:#111827;color:#fff;padding:18px}nav{display:flex;gap:6px;overflow:auto;padding:10px;background:#fff;position:sticky;top:0}button{padding:10px 14px;border:0;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer}.tab{background:#e5e7eb;color:#111}.active{background:#111827;color:#fff}.wrap{max-width:1100px;margin:auto;padding:16px}.card{background:#fff;border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #0001}input,select{padding:11px;border:1px solid #d1d5db;border-radius:8px;width:100%;box-sizing:border-box;margin:5px 0 10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.status{padding:10px;border-radius:8px;background:#f3f4f6;margin-top:10px}.ok{background:#dcfce7}.warn{background:#fef3c7}.bad{background:#fee2e2}.hidden{display:none}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left}.small{font-size:13px;color:#6b7280}.kpi{font-size:24px;font-weight:bold}</style></head><body><header><h1>Ferramenta de Vendas — V1.5</h1><div class="small" style="color:#d1d5db">Motor de oportunidades + conexão Mercado Livre</div></header><nav id="nav"></nav><main class="wrap"><section id="dashboard" class="page"></section><section id="oauth" class="page hidden"></section><section id="finder" class="page hidden"></section><section id="calc" class="page hidden"></section><section id="products" class="page hidden"></section><section id="settings" class="page hidden"></section></main><script>
const navItems=[['dashboard','Painel'],['oauth','Conectar Mercado Livre'],['finder','Encontrar fornecedores'],['calc','Calculadora'],['products','Produtos'],['settings','Configurações']];
let state=JSON.parse(localStorage.getItem('v15')||'null')||{settings:{margin:20,days:10,mlClientId:'',redirectUri:''},products:[],offers:[],market:[],connected:false};
function save(){localStorage.setItem('v15',JSON.stringify(state))} function money(x){return 'R$ '+Number(x||0).toFixed(2).replace('.',',')} function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));render(id)}
navItems.forEach(([id,n])=>{let b=document.createElement('button');b.textContent=n;b.dataset.id=id;b.className='tab';b.onclick=()=>show(id);document.getElementById('nav').appendChild(b)});
function render(id){if(id==='dashboard')renderDash();if(id==='oauth')renderOAuth();if(id==='finder')renderFinder();if(id==='calc')renderCalc();if(id==='products')renderProducts();if(id==='settings')renderSettings()}
function renderDash(){dashboard.innerHTML=`<div class=card><h2>Painel</h2><div class=grid><div><div class=small>Produtos</div><div class=kpi>${state.products.length}</div></div><div><div class=small>Ofertas importadas</div><div class=kpi>${state.offers.length}</div></div><div><div class=small>Mercado Livre</div><div class=kpi>${state.connected?'🟢 Conectado':'🔴 Não conectado'}</div></div></div></div><div class=card><h3>Regras do motor</h3><p>Margem líquida mínima: <b>${state.settings.margin}%</b></p><p>Prazo máximo: <b>${state.settings.days} dias</b></p><p>Compra automática: <b>desativada</b></p></div>`}
function renderOAuth(){oauth.innerHTML=`<div class=card><h2>Conectar Mercado Livre</h2><p>Esta tela prepara o OAuth 2.0. A conexão real precisa de uma aplicação criada no DevCenter do Mercado Livre.</p><div class=grid><div><label>Client ID / APP ID</label><input id=client value="${state.settings.mlClientId}" placeholder="Cole o APP ID"></div><div><label>Redirect URI</label><input id=redirect value="${state.settings.redirectUri}" placeholder="https://seu-dominio.com/oauth/callback"></div></div><button onclick="saveOAuth()">Salvar configuração</button> <button onclick="startOAuth()">Autorizar Mercado Livre</button><div class="status ${state.connected?'ok':'warn'}">${state.connected?'Mercado Livre autorizado.':'Ainda não conectado. Nenhum token foi inventado ou salvo.'}</div><hr><h3>Como configurar</h3><ol><li>Criar a aplicação no DevCenter.</li><li>Copiar o Client ID para esta tela.</li><li>Configurar exatamente o mesmo Redirect URI no Mercado Livre.</li><li>Usar OAuth 2.0/PKCE quando aplicável.</li><li>Depois da autorização, o backend deverá trocar o code por access token e guardar o refresh token com segurança.</li></ol><p class=small>Por segurança, a Secret Key não deve ser colocada neste HTML. Ela deve ficar no servidor/backend.</p></div>`}
function saveOAuth(){state.settings.mlClientId=client.value.trim();state.settings.redirectUri=redirect.value.trim();save();renderOAuth()} function startOAuth(){if(!state.settings.mlClientId||!state.settings.redirectUri){alert('Preencha Client ID e Redirect URI primeiro.');return} let u='https://auth.mercadolivre.com.br/authorization?response_type=code&client_id='+encodeURIComponent(state.settings.mlClientId)+'&redirect_uri='+encodeURIComponent(state.settings.redirectUri)+'&state='+crypto.randomUUID();window.open(u,'_blank')}
function renderFinder(){finder.innerHTML=`<div class=card><h2>Encontrar fornecedores e analisar oportunidade</h2><div class=grid><div><label>Produto</label><input id=q placeholder="Ex.: Fone de ouvido Bluetooth"></div><div><label>Preço pretendido (opcional)</label><input id=price type=number step=.01 placeholder="39.90"></div></div><button onclick="analyze()">Pesquisar e analisar</button><div id=result></div></div><div class=card><h3>Fluxo V1.5</h3><p>Produto → fornecedores → mercado → preço competitivo → custos → margem → decisão.</p><p class=small>Sem API autenticada, a ferramenta não fabrica preços. Ela mostra o estado de integração e mantém o motor pronto para receber dados reais.</p></div>`}
function analyze(){let term=q.value.trim();if(!term){alert('Digite um produto.');return}let p=Number(price.value||0);let r=document.getElementById('result');if(!state.connected){r.innerHTML=`<div class="status warn"><b>Mercado em tempo real ainda não conectado.</b><br>Conecte o Mercado Livre na aba “Conectar Mercado Livre” para alimentar esta análise com dados autorizados.</div>`;return}r.innerHTML=`<div class="status ok"><b>Consulta preparada para: ${term}</b><br>O motor está pronto para receber resultados reais da API.</div><div class=card><h3>Motor de decisão</h3><p>Preço informado: ${p?money(p):'não informado'}</p><p>Margem mínima: ${state.settings.margin}%</p><p>Prazo máximo: ${state.settings.days} dias</p><p class=small>Próxima camada: endpoint backend para busca, normalização dos anúncios e cálculo com taxas.</p></div>`}
function renderCalc(){calc.innerHTML=`<div class=card><h2>Calculadora</h2><div class=grid>${[['v','Preço de venda',0],['c','Custo produto',0],['f','Frete fornecedor',0],['m','Taxas/Marketplace',0],['t','Impostos',0],['o','Outros custos',0]].map(x=>`<div><label>${x[1]}</label><input id=x${x[0]} type=number step=.01 value="${x[2]}" oninput=calcNow()></div>`).join('')}</div><div id=calcOut class=status>Preencha os valores.</div></div>`}
function calcNow(){let v=+xv.value,c=+xc.value,f=+xf.value,m=+xm.value,t=+xt.value,o=+xo.value,total=c+f+m+t+o,profit=v-total,margin=v?profit/v*100:0;calcOut.innerHTML=`Custo total: <b>${money(total)}</b><br>Lucro líquido: <b>${money(profit)}</b><br>Margem líquida: <b>${margin.toFixed(2)}%</b><br><br><b>${margin>=state.settings.margin?'🟢 ATENDE':'🔴 NÃO ATENDE'}</b>`;calcOut.className='status '+(margin>=state.settings.margin?'ok':'bad')}
function renderProducts(){products.innerHTML=`<div class=card><h2>Produtos</h2><div class=grid><input id=np placeholder="Nome do produto"><button onclick="addProduct()">Adicionar produto</button></div><table><tr><th>Produto</th><th>Ação</th></tr>${state.products.map((p,i)=>`<tr><td>${p}</td><td><button onclick="state.products.splice(${i},1);save();renderProducts()">Excluir</button></td></tr>`).join('')}</table></div>`}function addProduct(){let p=np.value.trim();if(p){state.products.push(p);save();renderProducts()}}
function renderSettings(){settings.innerHTML=`<div class=card><h2>Configurações</h2><label>Margem líquida mínima (%)</label><input id=sm type=number value="${state.settings.margin}"><label>Prazo máximo de entrega (dias)</label><input id=sd type=number value="${state.settings.days}"><button onclick="state.settings.margin=+sm.value;state.settings.days=+sd.value;save();renderSettings()">Salvar regras</button><div class=status>Compra automática: <b>OFF</b> — aprovação manual.</div></div>`}
show('dashboard');</script></body></html>
